<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101216" />
    <title>accbot · 工作台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23ef8267'/%3E%3Cpath d='M10 12h20v14H18l-5 4v-4h-3z' fill='none' stroke='%23121519' stroke-width='2.5' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='19' r='1.5'/%3E%3Ccircle cx='24' cy='19' r='1.5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/assets/styles/tokens.css" />
    <link rel="stylesheet" href="/assets/styles/layout.css" />
    <link rel="stylesheet" href="/assets/styles/components.css" />
    <link rel="stylesheet" href="/assets/styles/views.css" />
    <link rel="stylesheet" href="/assets/styles/plugin-panel.css" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("accbot-theme") || "dark";
      } catch {}
    </script>
    <script type="module" src="/assets/js/app.js"></script>
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#plugins" aria-label="accbot 工作台"
        ><span class="brand-mark"
          ><svg viewBox="0 0 32 32" fill="none">
            <path
              d="M6 8h20v14H14l-5 4v-4H6V8Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
            <circle cx="12" cy="15" r="1.5" fill="currentColor" />
            <circle cx="20" cy="15" r="1.5" fill="currentColor" /></svg></span
        ><span>accbot<small>GROUP CHAT FRAMEWORK</small></span></a
      >
      <nav aria-label="主导航">
        <div class="nav-label">管理</div>
        <a class="nav-item" href="#plugins" data-route="plugins"
          ><span data-icon="puzzle"></span><span>插件</span
          ><span class="nav-count" id="nav-plugin-count">—</span></a
        >
        <a class="nav-item" href="#models" data-route="models"
          ><span data-icon="brain"></span><span>模型卡</span
          ><span class="nav-count" id="nav-model-count">—</span></a
        >
        <a class="nav-item" href="#personas" data-route="personas"
          ><span data-icon="user"></span><span>人格卡</span
          ><span class="nav-count" id="nav-persona-count">—</span></a
        >
        <a class="nav-item" href="#prompts" data-route="prompts"
          ><span data-icon="file"></span><span>系统提示词</span
          ><span class="nav-count" id="nav-prompt-count">—</span></a
        >
        <a class="nav-item" href="#adapters" data-route="adapters"
          ><span data-icon="cable"></span><span>适配器</span
          ><span class="nav-chevron" data-icon="chevron-down"></span
        ></a>
        <a class="nav-item nav-child" href="#onebot" data-route="onebot"
          ><span class="child-dot"></span><span>OneBot</span
          ><span class="nav-count" id="nav-onebot-count">—</span></a
        >
        <div class="nav-label nav-label-spaced">配置</div>
        <a class="nav-item" href="#credentials" data-route="credentials"
          ><span data-icon="key"></span><span>密钥管理</span></a
        >
      </nav>
      <div class="sidebar-bottom">
        <div class="instance-card">
          <span class="instance-icon" data-icon="server"></span>
          <div>
            <strong id="instance-state">正在连接</strong
            ><span>本地实例 <span class="mono">v0.1.0</span></span>
          </div>
          <span class="status-dot" id="instance-dot"></span>
        </div>
        <div class="sidebar-note">为群聊而生，按你的方式扩展。</div>
      </div>
    </aside>
    <div class="sidebar-shade" id="sidebar-shade"></div>
    <main class="main-shell">
      <header class="topbar">
        <div class="breadcrumb">
          <button
            class="icon-button mobile-menu"
            id="mobile-menu"
            aria-label="打开导航"
          >
            <span data-icon="menu"></span></button
          ><span>工作台</span><span class="breadcrumb-slash">/</span
          ><strong id="breadcrumb-current">插件</strong>
        </div>
        <div class="topbar-actions">
          <span class="local-status"
            ><span class="status-dot good"></span>本地运行</span
          ><span class="topbar-divider"></span
          ><button
            class="icon-button"
            id="theme-toggle"
            aria-label="切换明暗主题"
            title="切换明暗主题"
          >
            <span data-icon="sun"></span>
          </button>
        </div>
      </header>
      <div class="content" id="content">
        <div class="loading-state">
          <span class="spinner"></span>
          <p>正在连接工作台…</p>
        </div>
      </div>
      <footer class="page-footer">
        <span>accbot <span class="muted">/</span> 群聊 AI 机器人框架</span>
      </footer>
    </main>
    <div class="toast-stack" id="toasts" aria-live="polite"></div>
    <div id="dialogs"></div>
  </body>
</html>
