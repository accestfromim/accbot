[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "accbot"
version = "0.1.0"
description = "Protocol-independent infrastructure for group-chat AI bots"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "packaging>=24", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
ai = [
    "beautifulsoup4>=4.13,<5",
    "pillow>=11,<13",
]

[project.scripts]
accbot = "accbot.__main__:main"

[project.urls]
Repository = "https://github.com/accestfromim/accbot"
Documentation = "https://github.com/accestfromim/accbot/blob/main/README.md"
Issues = "https://github.com/accestfromim/accbot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/accbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
